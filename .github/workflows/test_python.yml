name: CHAMP-EU CI - Python tests for the TREXIO tools integration

on:
  push:
    branches: [main, ci_hotfix]
    paths:
      - 'tools/trex_tools/**'
      - 'tests/CI_test/champ_test_runner.py'
      - '.github/workflows/test_python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/trex_tools/**'
      - 'tests/CI_test/champ_test_runner.py'
      - '.github/workflows/test_python.yml'
  workflow_dispatch:

env:
  TREXIO_VERSION: 2.6.1

jobs:
  build:
    name: TREXIO Github CI Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 200
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest

    - name: "CI test runner selftest with python-${{ matrix.python-version }}"
      run: |
        ./tests/CI_test/champ_test_runner.py selftest

    - name: Install Cmake and HDF5
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake
        sudo apt-get install -y libhdf5-dev

    - name: Install Trexio
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran
        sudo apt-get install -y gcc
        set -e
        wget -q "https://github.com/TREX-CoE/trexio/releases/download/v${TREXIO_VERSION}/trexio-${TREXIO_VERSION}.tar.gz"
        tar -xzf "trexio-${TREXIO_VERSION}.tar.gz"
        cd "trexio-${TREXIO_VERSION}/"
        ./configure FC=gfortran CC=gcc
        make all -j$(nproc)
        make check
        sudo make install
        sudo cp include/* /usr/local/include/
        python -m pip install trexio
        python -m pip install trexio_tools

    - name: "Test 00 Python-${{ matrix.python-version }} unit testing using pytest"
      run: |
        echo "Running the trex2champ converter tests with python-${{ matrix.python-version }}"
        cd tools/trex_tools
        pytest
