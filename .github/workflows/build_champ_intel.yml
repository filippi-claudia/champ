name: CHAMP-EU CI - Release build - Intel oneAPI hpckit toolchain

on:
  push:
    branches:
      - 'releases/**'
      - main
    tags:
      - v2.*.*
      - v3.*.*
  pull_request:
    branches:
      - 'releases/**'
      - main
  workflow_dispatch:

jobs:
  build_champ:
    strategy:
      matrix:
        toolchain: ['intel']
    name: Build CHAMP with ${{ matrix.toolchain }} OneAPI GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - name: Use Intel oneAPI GitHub Actions fast setup
        uses: neelravi/intel-oneapi-github-actions@latest
        with:
          components: basekit, hpckit

      # The fast setup provides the C/C++ toolchain only; without ifx the
      # mpiifx wrapper fails ("ifx: command not found").
      - name: Install the Intel oneAPI Fortran compiler
        run: |
          set -e
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-fortran

      - name: Get the CHAMP code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake python3
          ln -sf /usr/bin/python3 /usr/bin/python
          which python
          python --version

      - name: Compile the CHAMP code using Intel
        run: |
          source /opt/intel/oneapi/setvars.sh
          set -e
          cmake --version
          ifx --version
          icx --version
          mpiifx --version
          mpiicx --version

          cmake -H. -Bbuild \
            -DCMAKE_Fortran_COMPILER=mpiifx \
            -DCMAKE_C_COMPILER=mpiicx \
            -DENABLE_TREXIO=OFF \
            -DENABLE_QMCKL=OFF

          cmake --build build -- -j2

      - name: Run all tests
        run: |
          source /opt/intel/oneapi/setvars.sh
          set -e
          cd build
          export PATH="/usr/bin:$PATH"
          ctest --output-on-failure --no-tests=error -j "$(nproc)" -LE "(TREXIO|QMCKL)"

      # Runs whether or not ctest passed: its purpose is to show, for every
      # case, the value the run produced next to the reference it was
      # compared against, and to publish those values as updated manifests.
      - name: Report the obtained values and the references they imply
        if: always()
        uses: ./.github/actions/champ-test-values
        with:
          artifact-name: champ-reference-values-intel
