name: CHAMP-EU CI - Debug build - Intel oneAPI and GNU toolchain

on:
  push:
    branches: [main, ci_hotfix]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: 'ctest label selector (-L), e.g. quick, VMC, H2O'
        default: "quick"

jobs:
  debug_build_test_champ:
    name: build and test with ${{ matrix.toolchain }} ${{ matrix.mode }} mode
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    strategy:
      matrix:
        toolchain: ['intel','gnu']
        mode: ['RELEASE']
        exclude:
          - toolchain: 'intel'
            mode: 'DEBUG'
      fail-fast: false
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
    - uses: actions/checkout@v2
    - name: Get Intel Key
      if: matrix.toolchain == 'intel'
      run: |
        wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
        sudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
        rm GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
        sudo add-apt-repository "deb https://apt.repos.intel.com/oneapi all main"
        sudo apt-get update

    - name: Install Cmake and HDF5
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake
        sudo apt-get install -y libhdf5-dev

    - name: Install GNU compilers and libraries
      if: matrix.toolchain == 'gnu'
      run: |
           sudo apt-get update
           sudo apt install -y gfortran
           sudo apt install -y openmpi-bin
           sudo apt install -y libopenmpi-dev
           sudo apt install -y gawk
           sudo apt install -y liblapack-dev
           sudo apt install -y libblas-dev
           gawk --version
           mpirun --version
           gfortran --version

    - name: install Intel oneapi components
      if: matrix.toolchain == 'intel'
      run: |
        sudo apt-get update
        sudo apt-get install -y intel-oneapi-common-vars
        sudo apt-get install -y intel-oneapi-compiler-fortran-2021.3.0
        sudo apt-get install -y intel-oneapi-mkl-2021.3.0
        sudo apt-get install -y intel-oneapi-mkl-devel-2021.3.0
        sudo apt-get install -y intel-oneapi-mpi-2021.3.0
        sudo apt-get install -y intel-oneapi-mpi-devel-2021.3.0

    - name: Install Trexio
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake
        sudo apt-get install -y libhdf5-dev
        sudo apt-get install -y gfortran
        sudo apt-get install -y gcc
        wget https://github.com/TREX-CoE/trexio/releases/download/v1.0/trexio-1.0.0.tar.gz
        tar -xzf trexio-1.0.0.tar.gz
        cd trexio-1.0.0/
        ./configure FC=gfortran CC=gcc
        make all
        make check
        sudo make install
        sudo cp include/* /usr/local/include/

    - name: Compile the CHAMP code with INTEL
      if: matrix.toolchain == 'intel'
      run: |
        source /opt/intel/oneapi/setvars.sh
        printenv >> $GITHUB_ENV
        which mpiifort
        MPIRUN=`which mpirun`
        echo "mpirun used is " $MPIRUN
        cmake --version
        # cmake -H. -Bbuild -DCMAKE_Fortran_COMPILER=mpiifort -DCMAKE_BUILD_TYPE=DEBUG
        cmake -H. -Bbuild -DCMAKE_Fortran_COMPILER=mpiifort
        cmake --build build -- -j$(nproc)
        ulimit -s unlimited

    - name: Compile with GNU
      if: matrix.toolchain == 'gnu'
      run: |
        printenv >> $GITHUB_ENV
        which mpif90
        MPIRUN=`which mpirun`
        echo "mpirun used is " $MPIRUN
        cmake --version
        cmake -H. -Bbuild -DCMAKE_Fortran_COMPILER=mpif90 -DCMAKE_BUILD_TYPE=${{ matrix.mode }}
        cmake --build build -- -j$(nproc)
        ulimit -s unlimited

    # Tests labelled "quick" (defined in tests/CI_test/*/test.json) run
    # against the binaries this matrix job built.
    - name: Run the quick CI tests with ctest
      run: |
        ulimit -s unlimited
        ctest --test-dir build --output-on-failure --no-tests=error -j "$(nproc)" \
          -L "${{ github.event.inputs.tags || 'quick' }}"

    # Runs whether or not ctest passed: its purpose is to show, for every
    # case, the value this runner produced next to the reference it was
    # compared against.  Reporting only -- the manifests are not touched.
    - name: Report the obtained values and the references they imply
      if: always()
      uses: ./.github/actions/champ-test-values
      with:
        artifact-name: champ-reference-values-${{ matrix.toolchain }}-${{ matrix.mode }}





